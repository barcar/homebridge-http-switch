name: Node-CI

on:
  push:
    branches: ['**']
  pull_request:
  create:

permissions:
  contents: read

jobs:
  build:
    if: github.event_name != 'create' || ((github.repository == 'Supereg/homebridge-http-switch' || github.repository == 'barcar/homebridge-http-switch') && startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        node-version: [22.x, 24.x, 26.x]

    steps:
      - uses: actions/checkout@v6
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run tests
        run: npm test

      - name: coverage
        run: npm run coverage
        env:
          CI: true

  publish-npm:
    if: (github.repository == 'Supereg/homebridge-http-switch' || github.repository == 'barcar/homebridge-http-switch') && github.event_name == 'create' && startsWith(github.ref, 'refs/tags/v')

    needs: build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org/
          cache: npm

      - run: npm ci
      - run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.npm_token }}
